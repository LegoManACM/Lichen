[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lichen"
version = "0.1.0"
description = "Decentralized, end-to-end encrypted chat: gossiped phonebooks, hubs that store only IOUs, peer-to-peer hole punching, file sharing, terminal UI"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "LegoManACM" }]
keywords = ["chat", "decentralized", "p2p", "encryption", "terminal", "tui"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Topic :: Communications :: Chat",
]
dependencies = [
    "cryptography>=42",
    "websockets>=13",
    "pyyaml>=6",
    "textual>=0.80",
]

[project.urls]
Homepage = "https://github.com/LegoManACM/Lichen"

[project.scripts]
lichen = "lichen.cli:main"

[tool.setuptools]
packages = ["lichen"]
